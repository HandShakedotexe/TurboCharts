services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: liq-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liqintel}
      POSTGRES_USER: ${POSTGRES_USER:-liqintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"   # solo local; no exponer al exterior
    volumes:
      - timescaledata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liqintel} -d ${POSTGRES_DB:-liqintel}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescaledata:
